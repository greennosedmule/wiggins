# Publishes a signed release when a version tag is pushed (tools/release.sh makes
# one). Obtainium and anyone else install the APK from the GitHub release.
#
# Secrets (Settings > Secrets and variables > Actions):
#   WIGGINS_KEYSTORE_BASE64    the release keystore (.p12), base64-encoded
#   WIGGINS_KEYSTORE_PASSWORD  its password
#   WIGGINS_KEY_ALIAS          the key's alias
#   WIGGINS_KEY_PASSWORD       the key's password (the store password, for PKCS#12)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # The release key's certificate. Every release must be signed by it, or
  # installed copies can't update; the build fails rather than publish anything else.
  SIGNING_CERT_SHA256: fbb1b0f266dc35d4c98420c8744dd54691a71db2b947390f44fe085c49f3c875

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the app's version
        run: |
          version=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Install the Android SDK packages the build needs
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" > /dev/null
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WIGGINS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::The signing secrets aren't set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "WIGGINS_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Test and build the signed release
        env:
          WIGGINS_KEYSTORE_PASSWORD: ${{ secrets.WIGGINS_KEYSTORE_PASSWORD }}
          WIGGINS_KEY_ALIAS: ${{ secrets.WIGGINS_KEY_ALIAS }}
          WIGGINS_KEY_PASSWORD: ${{ secrets.WIGGINS_KEY_PASSWORD }}
        # No configuration cache: it would write the signing passwords to disk.
        run: ./gradlew --no-configuration-cache testDebugUnitTest assembleRelease

      - name: Check the signature and name the APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          # apksigner prints a line per signature scheme, e.g. "V2 Signer: certificate
          # SHA-256 digest: <hex>" (older versions: "Signer #1 certificate ..."). Every
          # signer must be the release key, and there must be one.
          certs=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" \
            | sed -nE 's/^.*[Ss]igner.* certificate SHA-256 digest: ([0-9a-f]+)$/\1/p' | sort -u)
          if [ "$certs" != "$SIGNING_CERT_SHA256" ]; then
            echo "::error::The APK is signed by '${certs//$'\n'/, }', not only the release key"
            exit 1
          fi
          cp "$apk" "wiggins-$VERSION.apk"
          sha256sum "wiggins-$VERSION.apk" > "wiggins-$VERSION.apk.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # A version with a suffix (0.2.0-beta1) is a pre-release.
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "wiggins-$VERSION.apk" "wiggins-$VERSION.apk.sha256" \
            --verify-tag --title "Wiggins $VERSION" --generate-notes "${flags[@]}"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
